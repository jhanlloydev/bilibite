<!DOCTYPE html>
<html>
<head>
    <title>Register Business - Bili-Bite</title>
</head>

<body>

    <h1>Register Your Business</h1>

    <form id="businessForm">

        <input type="text" id="businessName" placeholder="Business Name" required>

        <input type="text" id="ownerName" placeholder="Owner Name" required>

        <input type="text" id="barangay" placeholder="Barangay" required>

        <textarea id="description" placeholder="Business Description"></textarea>

        <button type="submit">
            Register Business
        </button>

    </form>

    <p id="message"></p>

<script type="module" src="register-business.js"></script>

</body>
</html>
